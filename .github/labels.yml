#
# Canonical label set for the repository. Synced to GitHub by
# .github/workflows/labels.yml on every push to main. The issue forms and the
# requirement-check workflows reference these names, so they must exist here.

# --- Type -------------------------------------------------------------------
- name: "bug"
  color: "d73a4a"
  description: "A reproducible defect"
- name: "enhancement"
  color: "a2eeef"
  description: "Feature request or improvement"
- name: "documentation"
  color: "0075ca"
  description: "Docs: user guide, README, or API headers"
- name: "question"
  color: "d876e3"
  description: "A usage question (prefer Discussions)"

# --- Triage / status --------------------------------------------------------
- name: "needs-triage"
  color: "fbca04"
  description: "Awaiting maintainer triage"
- name: "needs-info"
  color: "e99695"
  description: "Missing troubleshooting log or reproduction steps"
- name: "needs-requirements"
  color: "b60205"
  description: "PR does not meet the contribution requirements"
- name: "requirements-met"
  color: "0e8a16"
  description: "PR passes the automated requirement checks"
- name: "stale"
  color: "cccccc"
  description: "Inactive and non-compliant; scheduled for closing"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported elsewhere"
- name: "wontfix"
  color: "ffffff"
  description: "Out of scope or will not be actioned"
- name: "good first issue"
  color: "7057ff"
  description: "A good entry point for new contributors"
- name: "help wanted"
  color: "008672"
  description: "Maintainer would welcome a contribution here"

# --- Area -------------------------------------------------------------------
- name: "area: backend"
  color: "1d76db"
  description: "C++ services, API, tools"
- name: "area: frontend-qml"
  color: "5319e7"
  description: "QML / Kirigami UI"
- name: "area: android"
  color: "3ddc84"
  description: "Verzeta-Android wire client"
- name: "area: extension"
  color: "007acc"
  description: "Verzeta-VSCode-Extension wire client"
- name: "area: providers"
  color: "006b75"
  description: "LLM / image / embedding providers"
- name: "area: wire-remote"
  color: "0052cc"
  description: "Remote access, pairing, wire protocol"
- name: "area: skills"
  color: "bfd4f2"
  description: "Skill library and skill tools"
- name: "area: canvas"
  color: "c5def5"
  description: "Canvas editor and code execution"
- name: "area: build-ci"
  color: "555555"
  description: "Build system, packaging, CI"
- name: "area: windows"
  color: "0078d6"
  description: "Windows-specific"
- name: "area: linux"
  color: "fcae1e"
  description: "Linux-specific"
- name: "area: security"
  color: "b60205"
  description: "Security-relevant (do not file vulnerabilities publicly)"

# --- Priority ---------------------------------------------------------------
- name: "priority: critical"
  color: "b60205"
  description: "Data loss, crash, or launch blocker"
- name: "priority: high"
  color: "d93f0b"
  description: "Important; schedule soon"
- name: "priority: low"
  color: "c2e0c6"
  description: "Nice to have"
