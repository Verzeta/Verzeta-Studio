# Validates bug reports on open/edit. The issue FORM already enforces required
# fields at submission; this catches placeholder/empty debug logs and vague
# repro steps, labels the issue `needs-info`, and comments what is missing.
# Incomplete reports are closed later by the stale workflow.
name: Issue requirements

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'bug')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            // GitHub renders each form field as a "### <label>" heading followed
            // by the value; pull one section's value out of the rendered body.
            function section(heading) {
              const re = new RegExp("###\\s*" + heading + "[^\\n]*\\n+([\\s\\S]*?)(?:\\n###\\s|$)", "i");
              const m = body.match(re);
              return m ? m[1].trim() : "";
            }

            const placeholder = /^(n\/?a|none|na|-+|\.+|todo|will add|later|no ?logs?|nothing)\.?$/i;
            const debug = section("Debug log with traces");
            const steps = section("Steps to reproduce");

            const problems = [];
            if (!debug || debug.length < 40 || placeholder.test(debug) || debug === "_No response_") {
              problems.push("**A debug log with traces is required.** Re-run with `QT_LOGGING_RULES=\"verzeta.*=true\"`, reproduce the problem, and paste the relevant log lines. See the [troubleshooting guide](https://github.com/Verzeta/Verzeta-Studio/blob/main/Documentation/User/10-troubleshooting.md#capturing-detailed-logs-for-a-bug-report).");
            }
            if (!steps || steps.length < 15 || steps === "_No response_") {
              problems.push("**Steps to reproduce are missing or too vague.** Provide exact, numbered steps.");
            }

            const marker = "<!-- verzeta-issue-requirements -->";
            const comments = await github.rest.issues.listComments({
              ...context.repo, issue_number: issue.number, per_page: 100 });
            const prev = comments.data.find(c => c.body && c.body.includes(marker));

            async function ensureLabel(name, color) {
              try { await github.rest.issues.getLabel({ ...context.repo, name }); }
              catch { try { await github.rest.issues.createLabel({ ...context.repo, name, color }); } catch (e) {} }
            }

            if (problems.length) {
              await ensureLabel("needs-info", "d93f0b");
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ["needs-info"] });
              const msg = marker + "\n\n" +
                "Thanks for the report. Before it can be triaged, it needs the following:\n\n" +
                problems.map(p => "- " + p).join("\n") + "\n\n" +
                "Please **edit the issue** to add the missing information. Incomplete reports are closed automatically after 14 days: comment or edit and it reopens for triage. This keeps the tracker usable for everyone.";
              if (prev) await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body: msg });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: msg });
            } else {
              try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: issue.number, name: "needs-info" }); } catch (e) {}
              if (prev) await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id,
                body: marker + "\n\nThanks: the required troubleshooting log and reproduction steps are present. Ready for triage." });
            }
