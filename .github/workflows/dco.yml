# Developer Certificate of Origin: every commit in a PR must carry a
# `Signed-off-by:` trailer. Complements the CLA bot. Fails the check and
# comments the offending commits otherwise.
name: DCO

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number, per_page: 100 });
            const signoff = /^Signed-off-by: .+ <[^>]+@[^>]+>$/im;
            const missing = commits
              .filter(c => !signoff.test(c.commit.message || ""))
              .map(c => ({ sha: c.sha.substring(0, 7), title: (c.commit.message || "").split("\n")[0] }));

            const marker = "<!-- verzeta-dco -->";
            const comments = await github.rest.issues.listComments({
              ...context.repo, issue_number: pr.number, per_page: 100 });
            const prev = comments.data.find(c => c.body && c.body.includes(marker));

            if (missing.length) {
              const body = marker + "\n\n" +
                "**DCO check failed.** Every commit must certify the [Developer Certificate of Origin](https://developercertificate.org/) with a `Signed-off-by:` line.\n\n" +
                "Add sign-off going forward with `git commit -s`. To fix existing commits:\n" +
                "```bash\ngit rebase --exec 'git commit --amend --no-edit -s' -i origin/main\ngit push --force-with-lease\n```\n\n" +
                "Commits missing sign-off:\n" +
                missing.map(m => `- \`${m.sha}\` ${m.title}`).join("\n");
              if (prev) await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
              else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
              core.setFailed(`${missing.length} commit(s) missing Signed-off-by.`);
            } else if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id,
                body: marker + "\n\nAll commits are signed off (DCO). Thanks." });
            }
